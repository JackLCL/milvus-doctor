# Optional GitHub Actions configuration. Copy to .github/workflows/tests.yml
# using credentials with workflow permission to enable hosted CI.
name: Skill and read-only diagnostics
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'PyYAML>=6,<7'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/doctor.py --version
