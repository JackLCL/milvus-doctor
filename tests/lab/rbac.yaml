# Test-only permissions, scoped to the disposable Helm namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: doctor-test-reader
  namespace: doctor-test-helm
  labels: {io.milvus.doctor.lab: 'true'}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: doctor-test-reader
  namespace: doctor-test-helm
  labels: {io.milvus.doctor.lab: 'true'}
rules:
  - apiGroups: ['']
    resources: [pods, services, persistentvolumeclaims, events]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list]
  - apiGroups: [milvus.io]
    resources: [milvuses]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: doctor-test-reader
  namespace: doctor-test-helm
  labels: {io.milvus.doctor.lab: 'true'}
subjects:
  - kind: ServiceAccount
    name: doctor-test-reader
    namespace: doctor-test-helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: doctor-test-reader
