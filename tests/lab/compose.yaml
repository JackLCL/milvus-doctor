name: doctor-test-compose
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    labels: {io.milvus.doctor.lab: 'true'}
    command: [etcd, --advertise-client-urls=http://etcd:2379, --listen-client-urls=http://0.0.0.0:2379, --data-dir=/etcd, --quota-backend-bytes=536870912]
    mem_limit: 256m
    cpus: 0.5
    logging: {driver: json-file, options: {max-size: 10m, max-file: '2'}}
    healthcheck:
      test: [CMD, etcdctl, endpoint, health]
      interval: 10s
      timeout: 3s
      retries: 6
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    labels: {io.milvus.doctor.lab: 'true'}
    command: [minio, server, /minio_data]
    environment:
      MINIO_ROOT_USER: ${DOCTOR_LAB_MINIO_USER:?Set DOCTOR_LAB_MINIO_USER for this disposable lab}
      MINIO_ROOT_PASSWORD: ${DOCTOR_LAB_MINIO_PASSWORD:?Set DOCTOR_LAB_MINIO_PASSWORD for this disposable lab}
    mem_limit: 512m
    cpus: 0.5
    logging: {driver: json-file, options: {max-size: 10m, max-file: '2'}}
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 10s
      timeout: 3s
      retries: 6
  standalone:
    image: milvusdb/milvus:v2.6.17
    labels: {io.milvus.doctor.lab: 'true'}
    command: [milvus, run, standalone]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${DOCTOR_LAB_MINIO_USER:?Set DOCTOR_LAB_MINIO_USER for this disposable lab}
      MINIO_SECRET_ACCESS_KEY: ${DOCTOR_LAB_MINIO_PASSWORD:?Set DOCTOR_LAB_MINIO_PASSWORD for this disposable lab}
      DEPLOY_MODE: STANDALONE
    mem_limit: 2g
    cpus: 2
    logging: {driver: json-file, options: {max-size: 10m, max-file: '2'}}
    ports: [127.0.0.1:39530:19530, 127.0.0.1:39091:9091]
    depends_on:
      etcd: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9091/healthz]
      start_period: 60s
      interval: 10s
      timeout: 3s
      retries: 6
